<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Xを作ってみよう</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="post">
      <div class="avatar-area">
        <img class="avatar" src="images/doer-icon.jpg" />
      </div>
      <div class="content">
        <div class="header">
          <div class="meta">
            <span class="name">Do'er</span>
            <span class="username">@du_doer</span>
            <span class="date">2025年6月9日</span>
          </div>
          <img class="details-icon" src="images/details.svg" />
        </div>
        <div class="text">CSS完全に理解した！</div>
        <div class="actions">
          <div class="action">
            <img src="images/reply.svg" />
            <span>63</span>
          </div>
          <div class="action">
            <img src="images/repost.svg" />
            <span>2,130</span>
          </div>
          <div class="action">
            <img src="images/like.svg" />
            <span>9,920</span>
          </div>
          <div class="action">
            <img src="images/engagement.svg" />
            <span>12万</span>
          </div>
          <div class="spacer"></div>
          <img class="icon-only" src="images/bookmark.svg" />
          <img class="icon-only" src="images/share.svg" />
        </div>
      </div>
    </div>
  </body>
</html>
